name: CI

on:
  push:
    paths:
      - "faceless-yt/**"
  pull_request:
    paths:
      - "faceless-yt/**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faceless-yt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: faceless-yt/package-lock.json
      - run: npm ci
      - run: npm run typecheck
