name: mnemosyne-ci

on:
  push:
    branches: [main]
    paths: ["mnemosyne/**", ".github/workflows/mnemosyne-ci.yml"]
  pull_request:
    paths: ["mnemosyne/**", ".github/workflows/mnemosyne-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: mnemosyne
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
